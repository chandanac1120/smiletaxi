
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Get an Instant Quote | Smile Taxi Service</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

/* RESET */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'DM Sans', Arial, sans-serif;
    background: #f4f6fb;
    color: #202b40;
    min-height: 100vh;
}


/* BACK BUTTON */

.back-btn {
    position: absolute;
    top: 28px;
    left: 20px;

    display: inline-flex;
    align-items: center;
    gap: 8px;

    padding: 11px 20px;

    background: #192346;
    color: #fff;

    text-decoration: none;
    font-size: 15px;
    font-weight: 500;

    border-radius: 5px;
    transition: 0.3s;
}

.back-btn:hover {
    background: #29375e;
}


/* MAIN CONTAINER */

.quote-container {
    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: flex-start;

    padding: 123px 20px 40px;
}


/* FORM CARD */

.quote-card {
    width: 100%;
    max-width: 410px;

    background: #ffffff;

    padding: 24px;

    border-radius: 12px;

    box-shadow: 0 8px 28px rgba(0, 0, 0, 0.10);
}


/* HEADING */

.quote-card h1 {
    font-size: 20px;
    font-weight: 700;
    text-align: center;

    color: #192346;

    margin-bottom: 15px;
}

.quote-subtitle {
    text-align: center;
    font-size: 15px;
    line-height: 1.5;

    color: #60646e;

    margin-bottom: 21px;
}


/* FORM GROUP */

.form-group {
    margin-bottom: 13px;
}

.form-group label {
    display: block;

    font-size: 15px;
    font-weight: 600;

    margin-bottom: 6px;

    color: #252a35;
}

.required {
    color: #e53935;
}


/* INPUTS */

.form-group input,
.form-group select,
.form-group textarea {
    width: 100%;

    border: 1px solid #d7d9de;
    border-radius: 6px;

    background: #fff;

    padding: 12px;

    font-family: inherit;
    font-size: 15px;

    color: #222;

    outline: none;

    transition: border-color 0.2s, box-shadow 0.2s;
}

.form-group input,
.form-group select {
    height: 44px;
}

.form-group textarea {
    height: 135px;
    resize: vertical;
    min-height: 100px;
}

.form-group input::placeholder,
.form-group textarea::placeholder {
    color: #777d87;
}

.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus {
    border-color: #192346;
    box-shadow: 0 0 0 3px rgba(25, 35, 70, 0.08);
}


/* SELECT */

.form-group select {
    cursor: pointer;
}


/* WHATSAPP BUTTON */

.submit-btn {
    width: 100%;
    height: 47px;

    margin-top: 5px;

    border: none;
    border-radius: 6px;

    background: #20c65a;
    color: white;

    font-family: inherit;
    font-size: 15px;
    font-weight: 700;

    cursor: pointer;

    transition: 0.3s;

    display: flex;
    justify-content: center;
    align-items: center;
    gap: 9px;
}

.submit-btn:hover {
    background: #18ad4c;
    transform: translateY(-1px);
}

.submit-btn i {
    font-size: 19px;
}


/* MOBILE RESPONSIVE */

@media (max-width: 600px) {

    .back-btn {
        top: 15px;
        left: 15px;
        padding: 10px 14px;
        font-size: 13px;
    }

    .quote-container {
        padding: 85px 15px 25px;
    }

    .quote-card {
        max-width: 100%;
        padding: 23px 18px;
        border-radius: 10px;
    }

    .quote-card h1 {
        font-size: 19px;
    }

    .quote-subtitle {
        font-size: 14px;
    }

    .form-group label {
        font-size: 14px;
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
        font-size: 14px;
    }

}

</style>
</head>

<body>

<!-- BACK TO HOME -->

<a href="index.html" class="back-btn">
    <i class="fa-solid fa-arrow-left"></i>
    Back to Home
</a>


<!-- QUOTE FORM -->

<main class="quote-container">

    <div class="quote-card">

        <h1>Get an Instant Quote</h1>

        <p class="quote-subtitle">
            Fill in your travel details and we'll contact you within minutes.
        </p>


        <form id="quoteForm">

            <!-- FULL NAME -->

            <div class="form-group">
                <label for="fullName">
                    Full Name <span class="required">*</span>
                </label>

                <input
                    type="text"
                    id="fullName"
                    placeholder="Enter your full name"
                    required
                >
            </div>


            <!-- MOBILE -->

            <div class="form-group">
                <label for="mobile">
                    Mobile Number <span class="required">*</span>
                </label>

                <input
                    type="tel"
                    id="mobile"
                    placeholder="Enter your mobile number"
                    pattern="[6-9][0-9]{9}"
                    maxlength="10"
                    inputmode="numeric"
                    required
                >
            </div>


            <!-- PICKUP -->

            <div class="form-group">
                <label for="pickup">
                    Pickup Location <span class="required">*</span>
                </label>

                <input
                    type="text"
                    id="pickup"
                    placeholder="Enter pickup location"
                    required
                >
            </div>


            <!-- DROP -->

            <div class="form-group">
                <label for="drop">
                    Drop Location
                </label>

                <input
                    type="text"
                    id="drop"
                    placeholder="Enter drop location"
                >
            </div>


            <!-- DATE -->

            <div class="form-group">
                <label for="travelDate">
                    Travel Date
                </label>

                <input
                    type="date"
                    id="travelDate"
                >
            </div>


            <!-- TIME -->

            <div class="form-group">
                <label for="pickupTime">
                    Pickup Time <span class="required">*</span>
                </label>

                <input
                    type="time"
                    id="pickupTime"
                    required
                >
            </div>


            <!-- VEHICLE -->

            <div class="form-group">
                <label for="vehicle">
                    Select Vehicle <span class="required">*</span>
                </label>

                <select id="vehicle" required>
                    <option value="">Choose Vehicle</option>
                    <option value="Sedan">Sedan</option>
                    <option value="SUV">SUV</option>
                    <option value="Innova">Toyota Innova</option>
                    <option value="Innova Crysta">Innova Crysta</option>
                    <option value="Tempo Traveller">Tempo Traveller</option>
                    <option value="Luxury Vehicle">Luxury Vehicle</option>
                </select>
            </div>


            <!-- TRIP TYPE -->

            <div class="form-group">
                <label for="tripType">
                    Trip Type
                </label>

                <select id="tripType">
                    <option value="">Choose Trip Type</option>
                    <option value="One Way">One Way</option>
                    <option value="Round Trip">Round Trip</option>
                    <option value="Airport Transfer">Airport Transfer</option>
                    <option value="Local Rental">Local Rental</option>
                    <option value="Outstation">Outstation</option>
                    <option value="Tour Package">Tour Package</option>
                </select>
            </div>


            <!-- REQUIREMENTS -->

            <div class="form-group">
                <label for="requirements">
                    Travel Requirements
                </label>

                <textarea
                    id="requirements"
                    placeholder="Tell us about your travel requirements..."
                ></textarea>
            </div>


            <!-- SUBMIT -->

            <button type="submit" class="submit-btn">

                <i class="fa-brands fa-whatsapp"></i>

                Get Free Quote on WhatsApp

            </button>

        </form>

    </div>

</main>


<script>

// YOUR BUSINESS WHATSAPP NUMBER
// Replace with your actual number including country code.
// Example: 919876543210

const businessNumber = "91XXXXXXXXXX";


// FORM SUBMISSION

document.getElementById("quoteForm").addEventListener("submit", function(e) {

    e.preventDefault();

    const name = document.getElementById("fullName").value.trim();
    const mobile = document.getElementById("mobile").value.trim();
    const pickup = document.getElementById("pickup").value.trim();
    const drop = document.getElementById("drop").value.trim();
    const date = document.getElementById("travelDate").value;
    const time = document.getElementById("pickupTime").value;
    const vehicle = document.getElementById("vehicle").value;
    const trip = document.getElementById("tripType").value;
    const requirements = document.getElementById("requirements").value.trim();

    const message = `
Hello Smile Taxi Service!

I would like to get a travel quotation.

Customer Details:
Name: ${name}
Mobile: ${mobile}

Journey Details:
Pickup Location: ${pickup}
Drop Location: ${drop}
Travel Date: ${date || "Not specified"}
Pickup Time: ${time}
Vehicle: ${vehicle}
Trip Type: ${trip || "Not specified"}

Travel Requirements:
${requirements || "No additional requirements"}

Please share the quotation.

Thank you!
    `;

    if (businessNumber.includes("X")) {
        alert("Please configure your business WhatsApp number in the JavaScript code.");
        return;
    }

    const whatsappURL =
        "https://wa.me/" + businessNumber +
        "?text=" + encodeURIComponent(message);

    window.open(whatsappURL, "_blank");

});


// DISABLE PAST DATES

const today = new Date();

const localToday = new Date(
    today.getTime() - today.getTimezoneOffset() * 60000
).toISOString().split("T")[0];

document.getElementById("travelDate").min = localToday;

</script>

</body>
</html>
